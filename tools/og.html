<!doctype html>
<!-- Source for og.png (1200x630 social preview). Regenerate with: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Hanken Grotesk";
    font-weight: 400 500;
    font-display: block;
    src: url(../fonts/hanken-grotesk-latin.woff2) format("woff2");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F2F3F1;
    color: #1B1F23;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 72px 88px 112px;
    display: grid;
    grid-template-rows: 1fr auto;
  }
  h1 {
    align-self: end;
    font-weight: 500;
    font-size: 172px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    margin-left: -0.04em;
  }
  footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 2px solid #D3D7D4;
    font-size: 40px;
    line-height: 1.3;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  footer .soft { color: #686F76; }
</style>
</head>
<body>
  <h1>Tristan<br>Tran</h1>
  <footer>
    <span>Principal Software Developer at Upgrade</span>
    <span class="soft">Montreal 🇨🇦</span>
  </footer>
</body>
</html>
