<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Tristan Tran</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Hanken Grotesk";
    font-style: normal;
    font-weight: 400 500;
    font-display: swap;
    src: url(/fonts/hanken-grotesk-latin.woff2) format("woff2");
  }
  :root {
    --paper: #F2F3F1;
    --ink: #1B1F23;
    --muted: #686F76;
    --rule: #D3D7D4;
    --accent: #2F4E6F;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14171A;
      --ink: #E8EAE7;
      --muted: #8E959C;
      --rule: #2A2F34;
      --accent: #9DB8D6;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: clamp(1.25rem, 4vw, 3rem);
    max-width: 1280px;
    margin: 0 auto;
  }

  header { color: var(--muted); font-size: 0.9375rem; }

  main {
    align-self: end;
    padding-bottom: clamp(2.5rem, 8vh, 6rem);
  }

  h1 {
    font-weight: 500;
    font-size: clamp(3.25rem, 12vw, 9.5rem);
    line-height: 0.92;
    letter-spacing: -0.045em;
    margin-left: -0.04em;
  }

  p {
    margin-top: clamp(1.75rem, 4vh, 2.75rem);
    font-size: clamp(1.125rem, 1.9vw, 1.375rem);
    line-height: 1.45;
  }
  p .soft { display: block; color: var(--muted); }

  a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-size: 100% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    padding-bottom: 2px;
    transition: background-size .3s ease, color .2s;
  }
  a:hover { color: var(--accent); background-size: 100% 2px; }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header>tristantran.ca</header>
  <main>
    <h1>404</h1>
    <p>
      This page doesn't exist. <a href="/">Back home</a>
      <span class="soft" lang="fr">Cette page n'existe pas.</span>
    </p>
  </main>
</div>
</body>
</html>
